name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run HTMLHint
        run: npx htmlhint "src/**/*.html"

      - name: Run Stylelint
        run: |
          echo '{ "extends": "stylelint-config-standard" }' > .stylelintrc.json
          if ls styles/**/*.css 1> /dev/null 2>&1; then
            npx stylelint "styles/**/*.css"
          else
            echo "No CSS files found. Skipping Stylelint."
          fi

  build:
    name: Build Static Website
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build with Parcel
        run: npx parcel build src/index.html --dist-dir build
