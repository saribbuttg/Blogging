name: PR Validation

on:
  pull_request:

jobs:
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Stylelint on CSS
        run: npx stylelint "styles/**/*.css"

      - name: Run HTMLHint on HTML
        run: npx htmlhint "src/**/*.html"

  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build with Parcel
        run: npx parcel build src/index.html --dist-dir build
